services:
  app:
    build: .
    env_file:
      app/.env
    ports:
      - "80:80"
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

    networks:
      - app-network

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - app-network

  postgres:
    image: "postgres:alpine"
    container_name: "postgres_db"
    env_file:
      - app/.env
    ports:
      - "5432:5432"
    volumes:
      - ./sql_data:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge