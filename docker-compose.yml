services:
  app:
    build: .
    ports:
      - "80:80"
    environment:
      - REDIS_HOST=redis
      - DATABASE_USEL
    depends_on:
      - redis
      - postgres
    networks:
      - app-network

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - app-network

  postgres:
    image: "postgres:latest"
    container_name: "postgres_db"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - ./sql_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network


networks:
  app-network:
    driver: bridge