services:
  api:
    image: "weather_app:latest"
    container_name: api
    env_file:
      - .env
    ports:
      - "80:80"
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DOCKER=1
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command: sleep infinity #uvicorn main:app --host 0.0.0.0 --port 80
    networks:
      - app-network

  bot:
    image: "weather_app:latest"
    container_name: bot
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DOCKER=1
      - ENVIRONMENT=api
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command: python main.py
    networks:
      - app-network

  celery_worker:
    image: "weather_app:latest"
    container_name: celery_worker
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DOCKER=1
      - ENVIRONMENT=api
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command: celery -A celery_tasks worker --pool=solo
    networks:
      - app-network

  celery_beat:
    image: "weather_app:latest"
    container_name: celery_beat
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DOCKER=1
      - ENVIRONMENT=api
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command: celery -A celery_tasks beat
    networks:
      - app-network


  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - app-network

  postgres:
    image: "postgres:alpine"
    container_name: "postgres_db_weather"
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_weather:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_weather: